<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#brandBg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Shadow Group for Documents -->
  <g filter="url(#cardGlow)">
    <!-- Back Document (Source File) -->
    <path d="M 132 104 L 272 104 L 336 168 L 336 376 A 22 22 0 0 1 314 398 L 132 398 A 22 22 0 0 1 110 376 L 110 126 A 22 22 0 0 1 132 104 Z" 
          fill="#ffffff" opacity="0.4" />

    <!-- Front Document (Target / Conversion File) -->
    <path d="M 166 138 L 316 138 L 386 208 L 386 422 A 26 26 0 0 1 360 448 L 166 448 A 26 26 0 0 1 140 422 L 140 164 A 26 26 0 0 1 166 138 Z" 
          fill="url(#docGrad)" />
    
    <!-- Folded Corner Flap -->
    <path d="M 310 138 L 310 202 A 8 8 0 0 0 318 210 L 386 210 Z" 
          fill="#cbd5e1" />
  </g>

  <!-- Format Tag on Front File -->
  <rect x="176" y="182" width="76" height="16" rx="5" fill="#fee2e2" />
  <rect x="186" y="187" width="54" height="6" rx="3" fill="#e11d48" />

  <!-- Dual Conversion Loop Arrows in Center -->
  <g fill="none" stroke="#e11d48" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top curved arrow going right -->
    <path d="M 198 300 C 198 256, 308 254, 324 270" />
    <!-- Top arrow head -->
    <path d="M 310 248 L 338 274 L 308 296" fill="#e11d48" stroke="none" />

    <!-- Bottom curved arrow going left -->
    <path d="M 326 342 C 326 386, 216 388, 200 372" />
    <!-- Bottom arrow head -->
    <path d="M 214 394 L 186 368 L 216 346" fill="#e11d48" stroke="none" />
  </g>
</svg>